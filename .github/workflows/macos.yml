name: Rebilium macOS build

on:
  pull_request:
  push:
    branches:
      - main
      - feature/rebilium-v02-liquid-glass

jobs:
  build-and-unit-test:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - name: Verify native dylib / host source-handoff experiment
        run: bash Experiments/InProcessHost/build_and_test.sh
      - name: Unit-test diagnostic host and real Swift-to-Python loopback IPC
        run: |
          python3 -m unittest discover -s Experiments/LoopbackHost -p 'test_*.py' -v
          bash Experiments/LoopbackHost/test_end_to_end.sh
      - name: Build and run Swift Testing tests
        run: |
          xcodebuild \
            -project MacExecutor.xcodeproj \
            -scheme MacExecutor \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:MacExecutorTests \
            test
      - name: Verify built app includes Rebilium Dock icon
        run: |
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path '*/Build/Products/Debug/MacExecutor.app' -type d \
            -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Built MacExecutor.app not found"
            exit 1
          fi
          ICON_PATH="$APP_PATH/Contents/Resources/AppIcon.icns"
          if [ ! -s "$ICON_PATH" ]; then
            echo "::error::AppIcon.icns not bundled in app resources"
            exit 1
          fi
          echo "Verified Dock icon at $ICON_PATH"
          file "$ICON_PATH"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' \
            "$APP_PATH/Contents/Info.plist"
